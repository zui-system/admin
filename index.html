<style>
/* ===== Grafit Korporat: gelap bawaan, terang sebagai pilihan ===== */
:root{--bg:#0E1114;--sf:#161A1F;--sf2:#1A1F25;--ln:#252B32;--ln2:#2A3139;--ink:#E6EAEE;--mu:#8B949E;--mu2:#6E7781;--ac:#3DB2DE;--acink:#0E1114;--chip:#12242D;--ok:#6FCF97;--okln:#24432F;--am:#F2B01E;--amln:#3A2C1A;--bad:#F07A6A;--badln:#4A2723;--sh:0 10px 30px rgba(0,0,0,.45);--hd:'Sora',system-ui,sans-serif;color-scheme:dark}
html:root[data-app="light"]{--bg:#F2F4F6;--sf:#FFFFFF;--sf2:#FFFFFF;--ln:#DCE1E6;--ln2:#D2D8DE;--ink:#141A20;--mu:#5B6672;--mu2:#77828E;--ac:#1C7FA7;--acink:#FFFFFF;--chip:#E5F2F8;--ok:#23794F;--okln:#BFDCCB;--am:#8F6200;--amln:#EAD9B0;--bad:#B93B30;--badln:#EDC6C1;--sh:0 10px 30px rgba(20,30,40,.12);color-scheme:light}
@media(prefers-color-scheme:light){html:root[data-app="auto"]{--bg:#F2F4F6;--sf:#FFFFFF;--sf2:#FFFFFF;--ln:#DCE1E6;--ln2:#D2D8DE;--ink:#141A20;--mu:#5B6672;--mu2:#77828E;--ac:#1C7FA7;--acink:#FFFFFF;--chip:#E5F2F8;--ok:#23794F;--okln:#BFDCCB;--am:#8F6200;--amln:#EAD9B0;--bad:#B93B30;--badln:#EDC6C1;--sh:0 10px 30px rgba(20,30,40,.12);color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
/* kerangka */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.badge{width:40px;height:40px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;font:600 12px var(--hd);letter-spacing:.12em;color:var(--ac);flex:none}
.top .tt{flex:1;min-width:0}.top .tt b{display:block;font:600 16px var(--hd)}.top .tt small{display:block;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{display:none}

.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ac);color:var(--acink);font:600 11px/20px var(--hd);text-align:center;display:none}.cnt.on{display:block}
.flt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.flt::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);color:var(--mu);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.ap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--ac);background:var(--chip);color:var(--ink)}
.chip i,.dot{width:8px;height:8px;border-radius:4px;background:var(--c,var(--ac));display:inline-block;flex:none}
.pg{display:none}.pg.on{display:block;animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.bn button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu2);font-size:10.5px}

/* komputer: menu samping */
@media(min-width:960px){

.b.pri{background:var(--ac);border-color:var(--ac);color:var(--acink)}

.sum{color:var(--mu);margin:0 4px 12px;font-size:14px}

.srch{display:block;width:100%;height:44px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);font-size:15px;margin:0 0 12px}
.ni,dialog input,dialog select,dialog textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);font-size:15px;margin-top:5px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:14px}.kv span{color:var(--mu)}.kv b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.h3{font:500 15px var(--hd);margin:20px 0 4px}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{color:var(--mu);font-weight:500;text-align:right;padding:6px 0 6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0}.tb td{padding:8px 0 8px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.sx{overflow-x:auto}
.qri{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}.qri img{width:76px;height:76px;object-fit:contain;border-radius:10px;border:1px solid var(--ln);background:#fff}
.warnc{border-color:var(--amln)}
.bnm{max-height:280px;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px}.bm{max-width:86%;padding:9px 12px;border-radius:12px;border:1px solid var(--ln);font-size:14.5px;overflow-wrap:anywhere}.bm.me{align-self:flex-end;background:var(--chip);border-color:transparent}.bm.ad{align-self:flex-start}.bm small{display:block;color:var(--mu2);font-size:11.5px;margin-top:3px}
.bnin{display:flex;gap:8px;margin-top:10px}.bnin input{flex:1;min-width:0;margin:0}
dialog{border:1px solid var(--ln);border-radius:18px;padding:22px;width:min(480px,94vw);background:var(--sf);color:var(--ink);max-height:90vh;overflow:auto;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(5,8,10,.6)}dialog h2{margin:0 0 4px;font:600 20px var(--hd);overflow-wrap:anywhere}
.btn{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:90vw}#ts.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:960px){#ts{bottom:28px}}
/* layar masuk, kunci, pembuka */
.au{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.ac{width:min(380px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:28px 24px;box-shadow:var(--sh)}
.ac h1{margin:0;font:600 40px/1 var(--hd);letter-spacing:.16em}.ac h1 .w2{display:block;font:400 11px var(--hd);letter-spacing:.42em;margin-top:10px;color:var(--mu)}
.ac .m{margin:16px 0 20px;font-size:14px}
.ac .b{width:100%;min-height:48px}
.gbig b{background:#fff;color:#4285F4;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.amg{font-size:13.5px;margin-top:12px;min-height:18px;color:var(--ok)}.amg.er{color:var(--bad)}
.lnk{display:block;margin:14px auto 0;color:var(--ac);font-size:14px}
#lk{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}#lk.on{display:flex}
#lk input{display:block;width:100%;padding:14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);font-size:22px;letter-spacing:.4em;text-align:center;margin-top:10px}
#spl{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spl 3.4s ease forwards}
#spl b{display:flex;font:600 56px/1 var(--hd);letter-spacing:.16em;margin-left:.16em}#spl b span{opacity:0;animation:zr .7s cubic-bezier(.2,.8,.2,1) forwards}
#spl b span:nth-child(1){animation-delay:.25s}#spl b span:nth-child(2){animation-delay:.45s}#spl b span:nth-child(3){animation-delay:.65s}
@keyframes zr{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#spl i{display:flex;font:400 13px var(--hd);font-style:normal;letter-spacing:.42em;margin:12px 0 0 .42em;color:var(--mu)}#spl i span{opacity:0;animation:zf .5s ease forwards;animation-delay:calc(1.1s + var(--i)*.08s)}
@keyframes zf{to{opacity:1}}
#spl u{display:block;width:150px;height:3px;border-radius:3px;background:var(--ac);margin-top:26px;transform:scaleX(0);box-shadow:0 0 12px var(--ac);animation:zl .9s cubic-bezier(.6,0,.2,1) 1.6s forwards}
@keyframes zl{to{transform:scaleX(1)}}@keyframes spl{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.pg.on{animation:none}.ib.spin svg{animation:none}}

<script>
'use strict';
/* =================== dasar =================== */
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CF=window.ZUI_ADMIN||{},ADMIN=String(CF.adminEmail||'admin.zuisystem@gmail.com').trim().toLowerCase(),DAY=864e5,VER='1.5';
const APPS=(CF.apps||[]).filter(a=>a&&a.firebase&&a.firebase.apiKey&&a.id).map((a,i)=>Object.assign({warna:'#2FA8D8',jenis:'standar',nama:a.id},a,{i,fa:null,fs:null,ready:false,on:false,err:'',lerr:'',loading:false,loaded:false,co:[],q:[],rev:[],sub:[],bh:[],pay:null,un:[],qf:0,bf:0,qr:null,qp:null}));
const pad=n=>String(n).padStart(2,'0'),MB=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const iso=m=>{const d=new Date(m);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=m=>{if(!m)return'-';const d=new Date(m);return d.getDate()+' '+MB[d.getMonth()]+' '+d.getFullYear()};
const fdt=m=>{if(!m)return'';const d=new Date(m);return d.getDate()+' '+MB[d.getMonth()]+' '+pad(d.getHours())+'.'+pad(d.getMinutes())};
const ms=v=>!v?0:typeof v==='number'?v:v.toMillis?v.toMillis():v.seconds?v.seconds*1000:typeof v==='string'?(Date.parse(v)||0):0;
const rp=n=>(n<0?'-':'')+'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)));
const fm=(n,c)=>c==='MYR'?(n<0?'-':'')+'RM '+new Intl.NumberFormat('ms-MY',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Math.abs(+n||0)):rp(n);
const rpk=n=>n>=1e9?'Rp '+(n/1e9).toFixed(1).replace('.',',')+' M':n>=1e6?'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt':n>=1e3?'Rp '+Math.round(n/1e3)+' rb':rp(n);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
const int=v=>Math.round(+String(v==null?'':v).replace(/[^\d]/g,'')||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TS=m=>firebase.firestore.Timestamp.fromMillis(m);
const addMonths=(m,n)=>{const d=new Date(m),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getTime()};
const left=c=>c.until?Math.ceil((c.until-Date.now())/DAY):0;
const appOf=i=>APPS[+i];
const dotOf=a=>`<span class="ap"><span class="dot" style="--c:${E(a.warna)}"></span>${E(a.nama)}</span>`;
